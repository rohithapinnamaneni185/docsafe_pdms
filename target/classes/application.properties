# ====================================================================
# Personal Document Management System (PDMS) Configuration
# ====================================================================

# Application Server Port
server.port=8080

# Application Name
spring.application.name=PersonalDocumentManagementSystem

# --------------------------------------------------------------------
# MySQL Database Configuration
# You can override these using Environment Variables:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# --------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/personal_document_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------------------
# JPA / Hibernate Configuration
# Automatically creates or updates table schema based on entities
# --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --------------------------------------------------------------------
# File Upload Configuration
# Upload directory for document images relative to project root
# --------------------------------------------------------------------
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# --------------------------------------------------------------------
# Static Web Resources Configuration
# --------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
