# ====================================================================
# DocuSafe application configuration
# ====================================================================
server.port=8080
spring.application.name=DocuSafe

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pdms;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File uploads
app.upload.dir=uploads
app.seed.default-password=${DOCUSAFE_SEED_PASSWORD:Password@123}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.web.resources.static-locations=classpath:/static/

# Google SMTP. Set SPRING_MAIL_PASSWORD to a Google App Password outside source control.
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME:rohithapinnamaneni185@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:nvsshqvsxgutsumz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Google OAuth2. Register http://localhost:8080/login/oauth2/code/google as a redirect URI.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:configure-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:configure-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
